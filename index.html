<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>باركور</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:Arial;touch-action:none;user-select:none}
canvas{display:block}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;color:#fff;background:#2a1060;z-index:100}
#code{font-size:40px;letter-spacing:8px;font-weight:bold}
#msg{color:#c8d4ff}
#joinBtn{position:fixed;top:15px;right:15px;z-index:120;background:#fff;color:#2a1060;padding:12px 22px;border:0;border-radius:22px;font-size:15px;font-weight:bold}
#joinBox{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:15px;background:rgba(0,0,0,.9);z-index:130;color:#fff}
#joinBox input{width:200px;padding:15px;font-size:22px;text-align:center;letter-spacing:6px;text-transform:uppercase;border:2px solid #fff;border-radius:8px;background:#000;color:#fff}
#joinBox button{padding:12px 24px;border:0;border-radius:8px;font-size:15px;font-weight:bold;background:#fff;color:#2a1060}
#joy{position:absolute;bottom:25px;left:25px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid #fff;z-index:10;display:none}
#stick{position:absolute;top:50%;left:50%;width:55px;height:55px;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
#jump{position:absolute;bottom:35px;right:35px;width:95px;height:95px;border-radius:50%;background:#fff;color:#2a1060;border:4px solid #ffcc00;font-size:18px;font-weight:bold;z-index:10;display:none;transition:background .15s}
#info{position:absolute;top:15px;left:15px;color:#fff;font-weight:bold;z-index:15;display:none;text-shadow:1px 1px 3px #000}
#stage{position:absolute;top:50px;left:15px;color:#ffe66d;font-weight:bold;background:rgba(0,0,0,.5);padding:6px 14px;border-radius:14px;z-index:15;display:none}
#toast{position:absolute;top:35%;width:100%;text-align:center;color:#ffe66d;font-size:26px;font-weight:bold;text-shadow:2px 2px 5px #000;z-index:12;display:none}
#coins{position:absolute;top:15px;right:15px;display:none;align-items:center;gap:10px;background:rgba(0,0,0,.6);padding:10px 16px;border-radius:26px;color:#fff;font-weight:bold;font-size:20px;z-index:15}
#coins img{width:42px;height:42px;border-radius:50%}
#coins button{background:#fff;color:#2a1060;border:0;padding:8px 14px;border-radius:16px;font-weight:bold;font-size:13px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:200}
#modalBox{background:#1a0a3a;border:2px solid #fff;padding:25px;border-radius:16px;text-align:center;color:#fff;max-width:320px;width:90%}
#modalCode{font-size:28px;font-weight:bold;letter-spacing:6px;color:#ffe66d;background:rgba(0,0,0,.4);padding:14px;border-radius:10px;margin:15px 0;font-family:monospace}
#modalBox button{border:0;padding:12px 22px;border-radius:10px;font-size:15px;font-weight:bold;background:#fff;color:#1a0a3a;margin:0 5px}
</style>
</head>
<body>
<div id="menu"><div id="code"></div><div id="msg">جاري الإنشاء...</div></div>
<button id="joinBtn">انضمام</button>
<div id="joinBox"><input id="joinInput" placeholder="----" maxlength="4"><div><button id="joinOk">دخول</button><button id="joinCancel">إلغاء</button></div></div>
<div id="joy"><div id="stick"></div></div>
<button id="jump">نط</button>
<div id="info"></div><div id="stage"></div><div id="toast"></div>
<div id="coins"><img src="https://i.postimg.cc/VvJQLGFK/IMG-20261008-153917-222.jpg"><span id="coinNum">0</span><button id="redeemBtn">استرداد</button><button id="viewBtn">الكود</button></div>
<div id="modal"><div id="modalBox"><h2 id="modalTitle">الكود</h2><div id="modalCode">-------</div><button id="copyBtn">نسخ</button><button id="closeBtn">موافق</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.0/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const POOL=['6767676','HAHAHAH','HESOYAM','MOKHSNB','VONJFTG'];
let peer,conn,isHost,code,seed,run=false;
let scene,cam,ren,clock,me,other,finish,won=false,stage=2,lastCP=-1;
const plats=[],spikes=[],cps=[],signs=[];
const pos=new THREE.Vector3(),pos2=new THREE.Vector3(),start=new THREE.Vector3(),save=new THREE.Vector3();
let yaw=0,pitch=0,yaw2=0,vy=0,ground=true,hurt=0;
let mx=0,my=0,joyId=null,jcx=0,jcy=0,lookId=null,lx=0,ly=0;
const keys={};
let savedCode='',coins=0;
let doubleJump=false;   /* دبل جمب متاح؟ */
const GRAV=22,JUMP=10,SPD=7.5,R=0.5,SX=0,SY=3.05,SZ=19;

const code4=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[~~(Math.random()*24)]).join('');

function host(){
  isHost=true;code=code4();seed=~~(Math.random()*1e5)+1;
  if(peer)try{peer.destroy()}catch(e){}
  peer=new Peer('wmg-'+code,{debug:0});
  peer.on('open',()=>{$('code').textContent=code;$('msg').textContent='أعط الرمز لصاحبك'});
  peer.on('connection',c=>{conn=c;c.on('open',()=>{c.send({t:'init',seed});startGame()});c.on('data',onData)});
  peer.on('error',e=>{if(e.type==='unavailable-id')setTimeout(host,300);else $('msg').textContent='خطأ: '+e.type});
}
$('joinBtn').onclick=()=>{$('joinBox').style.display='flex';$('joinInput').focus()};
$('joinCancel').onclick=()=>$('joinBox').style.display='none';
$('joinOk').onclick=join;
$('joinInput').onkeydown=e=>{if(e.key==='Enter')join()};
function join(){
  const c=$('joinInput').value.trim().toUpperCase();
  if(c.length!==4)return;
  if(peer)try{peer.destroy()}catch(e){}
  isHost=false;code=c;$('joinBox').style.display='none';$('msg').textContent='جاري الاتصال...';
  peer=new Peer({debug:0});
  peer.on('open',()=>{conn=peer.connect('wmg-'+c,{reliable:true});conn.on('data',onData)});
  peer.on('error',e=>$('msg').textContent='خطأ: '+e.type);
}
function onData(d){
  if(!d||!d.t)return;
  if(d.t==='init'){seed=d.seed;startGame()}
  if(d.t==='state'&&run){pos2.set(d.p[0],d.p[1],d.p[2]);yaw2=d.r}
}

function startGame(){
  if(run)return;run=true;
  start.set(SX,SY,SZ);
  pos.copy(start);save.copy(start);pos2.copy(start);
  yaw=pitch=vy=0;ground=true;lastCP=-1;won=false;stage=2;hurt=0;
  doubleJump=true;    /* دبل جمب عند البداية (المرحلة 2) */
  savedCode='';coins=0;showCoins();
  $('menu').style.display='none';$('joinBtn').style.display='none';
  $('joy').style.display='block';$('jump').style.display='block';
  $('info').style.display='block';$('info').textContent='الغرفة: '+code;
  $('stage').style.display='block';$('stage').textContent='المرحلة: 2';
  $('coins').style.display='flex';
  jumpBtnColor();
  buildScene();buildMap();bindControls();loop();
  setTimeout(()=>toast('وصلت مرحلة 2 — دبل جمب ⚡'), 500);
  setInterval(()=>{if(conn&&conn.open)conn.send({t:'state',p:[pos.x,pos.y,pos.z],r:yaw})},50);
}

function buildScene(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x87ceeb);
  scene.fog=new THREE.Fog(0x87ceeb,90,260);
  cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,500);
  ren=new THREE.WebGLRenderer();ren.setSize(innerWidth,innerHeight);
  document.body.appendChild(ren.domElement);
  scene.add(new THREE.AmbientLight(0xffffff,1));
  clock=new THREE.Clock();
  me=person(0x8a1a1a,0xffcc44);other=person(0x1a3a8a,0x00aaff);
  scene.add(me,other);
}
function person(bc,hc){
  const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,1.6,10),new THREE.MeshBasicMaterial({color:bc}));b.position.y=.8;
  const h=new THREE.Mesh(new THREE.SphereGeometry(.35,10,8),new THREE.MeshBasicMaterial({color:hc}));h.position.y=1.85;
  g.add(b,h);return g;
}
function plat(x,z,w,d,top,col,st){
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,.8,d),new THREE.MeshBasicMaterial({color:0x8a6a3a}));b.position.set(x,top-.4,z);
  const s=new THREE.Mesh(new THREE.BoxGeometry(w,.08,d),new THREE.MeshBasicMaterial({color:col}));s.position.set(x,top+.04,z);
  scene.add(b,s);plats.push({x,z,w:w/2,d:d/2,top,bot:top-.8,st});
}
function spike(x,z,top){
  const s=new THREE.Mesh(new THREE.ConeGeometry(.3,.9,8),new THREE.MeshBasicMaterial({color:0xff2222}));
  s.position.set(x,top+.55,z);scene.add(s);spikes.push({x,z,top,r:.55});
}
function checkpoint(x,z,top,col){
  const c=new THREE.Mesh(new THREE.ConeGeometry(.35,1,8),new THREE.MeshBasicMaterial({color:col}));
  c.position.set(x,top+.7,z);scene.add(c);
}
function sign(txt,x,y,z,col){
  const cv=document.createElement('canvas');cv.width=512;cv.height=256;
  const c=cv.getContext('2d');
  c.fillStyle='#1a0a3a';c.fillRect(0,0,512,256);
  c.strokeStyle=col;c.lineWidth=14;c.strokeRect(8,8,496,240);
  c.fillStyle=col;c.font='bold 96px Arial';c.textAlign='center';c.textBaseline='middle';
  c.fillText(txt,256,128);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(3.6,1.8),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv),transparent:true}));
  m.position.set(x,y,z);scene.add(m);signs.push(m);
}

function buildMap(){
  const cols=[0x00ff00,0x00ffff,0xff00ff,0xffff00,0xff8800];
  let top=3,cpCount=0;
  plat(SX,SZ,8,8,3,0x4a8a3a,2);

  for(let k=0;k<50;k++){
    const st=Math.floor(k/10)+2;   /* 2..6 */
    const first=k%10===0, last=k===49;

    const x=Math.sin(k*0.5)*6;
    const z=SZ-8-k*4.2;

    const amp = st<=3 ? 1.9 : 2.4;
    top += (Math.random()*2-1)*amp + 0.5;
    top = Math.max(2.5, Math.min(36, top));

    const w = last ? 5.5 : 2.0 + Math.random()*0.7;
    const d = last ? 5.5 : 2.0 + Math.random()*0.7;
    plat(x,z,w,d,top,last?0xffcc00:0x4a8a3a,st);
    if(last)finish=plats[plats.length-1];

    if(first){
      const c=['#7dffff','#ff7dff','#ffff7d','#ffb37d','#ff5555'][st-2];
      sign('المرحلة '+st,x,top+3.6,z,c);
    }

    if(!last&&k>0&&k%8===0){
      checkpoint(x,z,top,cols[cpCount%5]);
      cps.push({x,z,top,id:cpCount});
      cpCount++;
    }

    if(!last){
      const n=3+~~(Math.random()*3);
      for(let i=0;i<n;i++){
        const ang=Math.random()*Math.PI*2;
        spike(x+Math.cos(ang)*0.9,z+Math.sin(ang)*0.9,top);
      }
    }
  }
}

function bindControls(){
  $('joy').addEventListener('touchstart',e=>{
    e.preventDefault();const t=e.changedTouches[0];joyId=t.identifier;
    const r=$('joy').getBoundingClientRect();jcx=r.left+r.width/2;jcy=r.top+r.height/2;
  },{passive:false});
  $('joy').addEventListener('touchmove',e=>{
    e.preventDefault();
    for(const t of e.changedTouches){
      if(t.identifier!==joyId)continue;
      let dx=t.clientX-jcx,dy=t.clientY-jcy;const dist=Math.hypot(dx,dy);
      if(dist>60){dx=dx/dist*60;dy=dy/dist*60}
      $('stick').style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
      mx=dx/60;my=dy/60;
    }
  },{passive:false});
  const endJoy=e=>{for(const t of e.changedTouches)if(t.identifier===joyId){joyId=null;mx=my=0;$('stick').style.transform='translate(-50%,-50%)'}};
  $('joy').addEventListener('touchend',endJoy);$('joy').addEventListener('touchcancel',endJoy);
  document.body.addEventListener('touchstart',e=>{
    for(const t of e.changedTouches){
      if(t.target.closest('#joy,#jump,#info,#stage,#coins,#modal'))continue;
      if(t.clientX>innerWidth/2&&lookId===null){lookId=t.identifier;lx=t.clientX;ly=t.clientY}
    }
  },{passive:false});
  document.body.addEventListener('touchmove',e=>{
    for(const t of e.changedTouches){
      if(t.identifier!==lookId)continue;
      yaw-=(t.clientX-lx)*.005;pitch=Math.max(-1,Math.min(1,pitch-(t.clientY-ly)*.005));
      lx=t.clientX;ly=t.clientY;
    }
  },{passive:false});
  document.body.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===lookId)lookId=null});
  $('jump').addEventListener('touchstart',e=>{e.preventDefault();jump()},{passive:false});
  $('jump').addEventListener('mousedown',e=>{e.preventDefault();jump()});
  addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='Space')jump()});
  addEventListener('keyup',e=>keys[e.code]=0);
  $('redeemBtn').onclick=redeem;
  $('viewBtn').onclick=showSaved;
  $('copyBtn').onclick=copyCode;
  $('closeBtn').onclick=closeModal;
}

/* زر النط: أصفر = عندك دبل جمب، أبيض = ما عندك */
function jumpBtnColor(){
  $('jump').style.background = doubleJump ? '#ffe66d' : '#fff';
}

/* القفز: قفزة عادية + قفزة دبل جمب إذا متاحة */
function jump(){
  if(!run)return;
  if(ground){ vy=JUMP; ground=false; return; }
  if(doubleJump){
    vy=JUMP; doubleJump=false;
    jumpBtnColor();
    toast('دبل جمب! ⚡');
  }
}

function update(dt){
  if(hurt>0)hurt-=dt;
  let kx=0,kz=0;
  if(keys.KeyW||keys.ArrowUp)kz++;if(keys.KeyS||keys.ArrowDown)kz--;
  if(keys.KeyA||keys.ArrowLeft)kx--;if(keys.KeyD||keys.ArrowRight)kx++;
  kx+=mx;kz-=my;
  const len=Math.hypot(kx,kz);if(len>1){kx/=len;kz/=len}
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  const oldY=pos.y;
  let nx=pos.x+(fx*kz+rx*kx)*SPD*dt,nz=pos.z+(fz*kz+rz*kx)*SPD*dt;
  for(const p of plats){
    if(pos.y>=p.top-.1||pos.y+1.6<=p.bot+.05)continue;
    const dx=nx-p.x,dz=nz-p.z;
    if(Math.abs(dx)<p.w+R&&Math.abs(dz)<p.d+R){
      const ox=p.w+R-Math.abs(dx),oz=p.d+R-Math.abs(dz);
      if(ox<oz)nx+=dx>0?ox:-ox;else nz+=dz>0?oz:-oz;
    }
  }
  pos.x=nx;pos.z=nz;
  vy-=GRAV*dt;pos.y+=vy*dt;
  if(vy<=0){
    let best=-1e9,hit=null;
    for(const p of plats){
      const on=Math.abs(pos.x-p.x)<p.w+R*.6&&Math.abs(pos.z-p.z)<p.d+R*.6;
      if(on&&oldY>=p.top-.05&&pos.y<=p.top+.05&&p.top>best){best=p.top;hit=p}
    }
    if(hit){
      pos.y=best;vy=0;ground=true;
      /* الوصول لمرحلة جديدة = دبل جمب مرة واحدة */
      if(hit.st && hit.st !== stage){
        stage=hit.st;
        $('stage').textContent='المرحلة: '+stage;
        doubleJump=true;
        jumpBtnColor();
        toast('وصلت مرحلة '+stage+' — دبل جمب ⚡');
      }
      for(const cp of cps){
        if(Math.abs(cp.x-hit.x)<.6&&Math.abs(cp.z-hit.z)<.6&&Math.abs(cp.top-hit.top)<.5){
          if(cp.id>lastCP){lastCP=cp.id;save.set(cp.x,cp.top+.05,cp.z);toast('نقطة حفظ ✔')}
          break;
        }
      }
    }else ground=false;
  }else ground=false;
  if(hurt<=0){
    for(const s of spikes){
      const dx=pos.x-s.x,dz=pos.z-s.z;
      if(dx*dx+dz*dz<s.r*s.r&&pos.y>=s.top-.6&&pos.y<=s.top+1){die();break}
    }
  }
  if(pos.y<-25)die();
  if(finish&&!won&&Math.abs(pos.x-finish.x)<finish.w+.6&&Math.abs(pos.z-finish.z)<finish.d+.6&&pos.y>=finish.top-.3){
    won=true;
    if(!savedCode){
      savedCode=POOL[~~(Math.random()*POOL.length)];coins=5;showCoins();
      toast('فزت! 🎉');setTimeout(()=>showModal('كود الاسترداد',savedCode),700);
    }else toast('فزت! 🎉');
  }
}
function die(){
  pos.copy(lastCP<0?start:save);vy=0;ground=true;hurt=1;
  toast('آخ! 💥');
}

let tTimer;
function toast(m){
  $('toast').textContent=m;$('toast').style.display='block';
  clearTimeout(tTimer);tTimer=setTimeout(()=>$('toast').style.display='none',1500);
}
function showCoins(){$('coinNum').textContent=coins}
function showModal(t,c){$('modalTitle').textContent=t;$('modalCode').textContent=c;$('modal').style.display='flex'}
const closeModal=()=>$('modal').style.display='none';
function redeem(){if(!savedCode){toast('لم تفز بعد');return}coins=0;showCoins();closeModal();toast('تم الاسترداد')}
function showSaved(){if(!savedCode){toast('لا يوجد كود');return}showModal('الكود المحفوظ',savedCode)}
function copyCode(){if(navigator.clipboard)navigator.clipboard.writeText($('modalCode').textContent);toast('تم النسخ ✔')}

function loop(){
  requestAnimationFrame(loop);if(!run)return;
  update(Math.min(clock.getDelta(),.05));
  me.position.copy(pos);me.rotation.y=yaw+Math.PI;
  other.position.copy(pos2);other.rotation.y=yaw2+Math.PI;
  for(const s of signs)s.lookAt(cam.position.x,s.position.y,cam.position.z);
  const D=7,e=Math.max(.12,Math.min(1.15,.45-pitch));
  cam.position.set(pos.x+Math.sin(yaw)*D*Math.cos(e),pos.y+1.4+D*Math.sin(e),pos.z+Math.cos(yaw)*D*Math.cos(e));
  cam.lookAt(pos.x,pos.y+1.3,pos.z);
  ren.render(scene,cam);
}
addEventListener('resize',()=>{if(!cam)return;cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});

host();
</script>
</body>
</html>
